<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      overflow: hidden;
      color: white;
      text-align: center;
      position: relative;
    }

    #confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      padding: 2rem;
      max-width: 800px;
    }

    h1 {
      font-size: clamp(2rem, 8vw, 4rem);
      margin-bottom: 1rem;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700;
      }
      to {
        text-shadow: 0 0 20px #ff69b4, 0 0 40px #ff69b4;
      }
    }

    .message {
      font-size: clamp(1rem, 3vw, 1.4rem);
      margin: 1.5rem 0;
      line-height: 1.6;
      opacity: 0.95;
    }

    .cake {
      font-size: 6rem;
      margin: 1rem 0;
      animation: bounce 1.5s ease infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-15px);
      }
    }

    button {
      padding: 1rem 2rem;
      font-size: 1.1rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      margin: 0.5rem;
      background: linear-gradient(45deg, #ff6b6b, #ffa500);
      color: white;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
    }

    button:active {
      transform: scale(0.98);
    }

    .balloon {
      position: fixed;
      width: 60px;
      height: 80px;
      border-radius: 50%;
      opacity: 0.7;
      animation: float 8s ease-in-out infinite;
      z-index: 0;
    }

    .balloon::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      width: 2px;
      height: 30px;
      background: rgba(255, 255, 255, 0.5);
      transform: translateX(-50%);
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(-5deg);
      }
      50% {
        transform: translateY(-40px) rotate(5deg);
      }
    }

    footer {
      margin-top: 2rem;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <div class="container">
    <h1>Happy Birthday, <span id="name">Name</span>!</h1>
    <p class="message" id="message"></p>
    <div class="cake">🎂</div>
    <button id="celebrateBtn">🎉 Celebrate</button>
    <button id="musicBtn">🔊 Play Music</button>
    <audio id="birthdayMusic" loop></audio>
    <footer>Made with ❤️ by <span id="publisher"></span></footer>
  </div>

  <script>
    // ===== CHANGE THESE DETAILS =====
    const CONFIG = {
      name: "Birthday Person",
      publisher: "Your Name",
      message: "Wishing you a day filled with love, laughter, and everything that makes you smile. Happy Birthday!",
      musicUrl: "" // Optional: "birthday.mp3" or a direct MP3 link
    };
    // =================================

    document.getElementById('name').textContent = CONFIG.name;
    document.getElementById('publisher').textContent = CONFIG.publisher;
    document.getElementById('message').textContent = CONFIG.message;

    const music = document.getElementById('birthdayMusic');
    if (CONFIG.musicUrl) {
      music.src = CONFIG.musicUrl;
    }

    // Confetti
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    let confettiPieces = [];
    let animationId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createConfetti() {
      confettiPieces = [];
      for (let i = 0; i < 150; i++) {
        confettiPieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          w: Math.random() * 10 + 5,
          h: Math.random() * 6 + 4,
          color: `hsl(${Math.random() * 360}, 100%, 60%)`,
          speed: Math.random() * 3 + 2,
          angle: Math.random() * Math.PI * 2,
          spin: Math.random() * 0.2 - 0.1
        });
      }
    }

    function drawConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confettiPieces.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();

        p.y += p.speed;
        p.angle += p.spin;
        p.x += Math.sin(p.angle) * 0.5;

        if (p.y > canvas.height) {
          p.y = -10;
          p.x = Math.random() * canvas.width;
        }
      });
      animationId = requestAnimationFrame(drawConfetti);
    }

    function startConfetti() {
      createConfetti();
      if (!animationId) drawConfetti();
    }

    startConfetti();

    document.getElementById('celebrateBtn').addEventListener('click', () => {
      createConfetti();
    });

    // Balloons
    const balloonColors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#a06cd5', '#ff9f1c', '#ff69b4', '#00b4d8', '#f72585'];
    for (let i = 0; i < 8; i++) {
      const balloon = document.createElement('div');
      balloon.className = 'balloon';
      balloon.style.left = Math.random() * 90 + 5 + '%';
      balloon.style.top = Math.random() * 80 + 10 + '%';
      balloon.style.background = balloonColors[i % balloonColors.length];
      balloon.style.animationDelay = Math.random() * 5 + 's';
      balloon.style.animationDuration = (6 + Math.random() * 4) + 's';
      document.body.appendChild(balloon);
    }

    // Music toggle
    const musicBtn = document.getElementById('musicBtn');
    musicBtn.addEventListener('click', () => {
      if (!CONFIG.musicUrl) {
        alert('Add a music URL or birthday.mp3 file in CONFIG.musicUrl to enable music.');
        return;
      }
      if (music.paused) {
        music.play().catch(() => alert('Could not play music. Check the file/URL.'));
        musicBtn.textContent = '🔇 Pause Music';
      } else {
        music.pause();
        musicBtn.textContent = '🔊 Play Music';
      }
    });
  </script>
</body>
</html>
